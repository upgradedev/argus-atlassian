# Argus Bitbucket companion app.
#
# Forge cannot combine Bitbucket workspace scopes with Jira site scopes
# in one installable app. The site app in the repository root
# manifest.yml owns JSM, Jira, Confluence, and Rovo. This
# companion owns only the Bitbucket merge check and PR evidence panel.
# Both call the same deterministic domain core in src/argus/.
#
# This app root is apps/bitbucket/. Keeping Bitbucket route calls out
# of the site app's src/ tree matters: Forge lint scans source files
# under an app root, not only the referenced handler graph.
#
# app.id was assigned by Atlassian during the one-time Forge registration
# workflow on 2026-11-05.
# Zero Egress is declared by omission exactly as in the site manifest.

app:
  runtime:
    name: nodejs24.x
  id: ari:cloud:ecosystem::app/93761b7d-a9c2-4626-ba37-5df1f2040967

modules:
  bitbucket:mergeCheck:
    - key: argus-socratic-canary-merge-check
      function: canaryMergeCheck
      name: Argus Socratic Canary
      description: >-
        Runs the Elenchos Socratic Kill-Test against this pull request. A
        fake-green pipeline fails the check; a clean pipeline passes it.
      triggers:
        - on-code-pushed
        - on-merge

  bitbucket:repoPullRequestOverviewPanel:
    - key: argus-pr-canary-panel
      title: Argus Socratic Canary
      resource: argus-ui
      resolver:
        function: resolver

  function:
    - key: resolver
      handler: index.resolver
    - key: canaryMergeCheck
      handler: index.canaryMergeCheck

resources:
  - key: argus-ui
    path: ../../static/argus-ui/build

permissions:
  # Read-only by construction: the client exposes three GET methods.
  # Bitbucket nevertheless requires the admin scope for GET branch
  # restrictions, which supplies the r13 enforcement fact.
  scopes:
    - admin:repository:bitbucket
    - read:pullrequest:bitbucket
    - read:repository:bitbucket
