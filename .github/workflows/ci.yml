name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0: gitleaks scans a commit range and fails on the
      # default shallow checkout in pull request runs (first CI, 2026-11-03).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install manifest checker dependency
        run: pip install pyyaml

      - name: Unit and contract tests
        # Bare `node --test` on purpose: a directory argument works in
        # Node 20 on Windows but Node 24 on Linux resolves it as a module
        # path and fails before running anything (first CI run, 2026-11-03).
        run: node --test

      - name: Coverage gate, src only, lines at or above 85 (STANDARDS C1)
        run: >-
          node --experimental-test-coverage
          --test-coverage-include='src/**/*.js'
          --test-coverage-lines=85
          --test

      - name: Socratic Kill-Test benchmark (fails unless 20/20 separate)
        run: node scripts/run_killtest_benchmark.js

      - name: Manifest gate (zero egress, Rovo pairing, skill shape)
        run: python scripts/check_manifest.py

      - name: Generated demo is fresh
        run: |
          node scripts/build_demo.js
          git diff --exit-code -- demo docs static

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

