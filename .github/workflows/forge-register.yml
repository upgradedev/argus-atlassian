name: Forge register (manual, one-time)

# Registers this app with Atlassian, writes the assigned app.id back to
# a review branch, and adds the npm lockfile the deploy workflow needs.
# It refuses to run when app.id already exists, because running Forge
# register twice would create a second orphan app.

on:
  workflow_dispatch:
    inputs:
      appName:
        description: Forge app name (letters, numbers, spaces, hyphens)
        required: true
        default: Argus for Jira JSM and Bitbucket
        type: string
      developerSpaceId:
        description: Existing UpgradeDev Developer Space id
        required: true
        default: dd184132-e3f2-4dac-80c6-61d6e4e11f52
        type: string
      acceptTerms:
        description: Accept Atlassian developer terms for this registration
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: forge-register
  cancel-in-progress: false

jobs:
  register:
    runs-on: ubuntu-latest
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
      APP_NAME: ${{ inputs.appName }}
      DEVELOPER_SPACE_ID: ${{ inputs.developerSpaceId }}
      ACCEPT_TERMS: ${{ inputs.acceptTerms }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Refuse a second registration
        run: |
          if grep -Eq '^[[:space:]]*id:[[:space:]]*ari:cloud:ecosystem::app/' manifest.yml; then
            echo 'manifest.yml already has an app.id. Refusing to create an orphan app.'
            exit 1
          fi

      - name: Install Forge CLI
        run: npm install --global @forge/cli@latest

      - name: Authenticate without printing account details
        run: |
          forge settings set usage-analytics false
          forge whoami >/dev/null

      - name: Resolve the dependency lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Register the app
        # The installed CLI has no non-interactive register flag. Its
        # supported automation path is an existing Developer Space id
        # plus explicit terms acceptance supplied by the workflow input.
        run: |
          args=("$APP_NAME" --developer-space-id "$DEVELOPER_SPACE_ID")
          if [ "$ACCEPT_TERMS" = "true" ]; then
            args+=(--accept-terms)
          fi
          forge register "${args[@]}"

      - name: Prove app.id was written and lint now passes schema
        run: |
          grep -E '^[[:space:]]*id:[[:space:]]*ari:cloud:ecosystem::app/' manifest.yml
          forge lint

      - name: Open registration pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C chore/forge-registration
          git add manifest.yml package-lock.json
          git diff --cached --quiet && { echo 'No registration changes to commit.'; exit 1; }
          git commit -m 'chore(forge): register Argus app and add dependency lockfile'
          git push --force-with-lease origin chore/forge-registration
          gh pr create \
            --title 'chore(forge): register Argus app and add dependency lockfile' \
            --body 'Created by the manual Forge register workflow after successful authentication and forge lint. The app id is an Atlassian resource identifier, not a credential. Review the manifest and lockfile diff, then merge before dispatching Forge deploy.' \
            || gh pr view chore/forge-registration --json url --jq .url
